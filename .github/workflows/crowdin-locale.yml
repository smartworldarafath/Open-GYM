name: Tidy Crowdin translations

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

# Crowdin writes its own language codes into @@locale (es-ES, pt-PT, zh-CN…),
# and gen-l10n refuses to build when @@locale doesn't match the file name.
jobs:
  fix:
    if: github.head_ref == 'l10n_main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: l10n_main

      - name: Match @@locale and the repo layout
        run: |
          git fetch --depth=1 origin main
          git checkout origin/main -- lib/l10n/app_es.arb
          git show origin/main:tool/arb_tidy.py > "$RUNNER_TEMP/arb_tidy.py"
          python3 "$RUNNER_TEMP/arb_tidy.py"
          if git diff --quiet HEAD; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Tidy the translation files"
          git push origin HEAD:l10n_main
